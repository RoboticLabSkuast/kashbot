<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Technical Circuit Board Main Frame (Carbon Slate with Orange Rim) -->
  <rect x="70" y="40" width="460" height="320" rx="18" fill="url(#pcbGrad)" stroke="#EA580C" stroke-width="3" />

  <!-- Mounting Holes -->
  <circle cx="95" cy="65" r="8" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
  <circle cx="505" cy="65" r="8" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
  <circle cx="95" cy="335" r="8" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
  <circle cx="505" cy="335" r="8" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />

  <!-- PCB Copper / Orange Bus Traces -->
  <g stroke="#F97316" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M120 100 L180 100 L210 130 L260 130" />
    <path d="M120 120 L170 120 L190 140 L260 140" />
    <path d="M120 280 L180 280 L220 240 L260 240" />
    <path d="M340 130 L400 130 L430 90 L480 90" />
    <path d="M340 170 L420 170 L440 190 L480 190" />
    <path d="M340 240 L390 240 L420 280 L480 280" />
    <circle cx="120" cy="100" r="3" fill="#F59E0B" />
    <circle cx="120" cy="120" r="3" fill="#F59E0B" />
    <circle cx="480" cy="90" r="3" fill="#F59E0B" />
    <circle cx="480" cy="190" r="3" fill="#F59E0B" />
    <circle cx="480" cy="280" r="3" fill="#F59E0B" />
  </g>

  <!-- Central Edge Microcontroller / AI Neural Unit -->
  <rect x="250" y="140" width="100" height="100" rx="8" fill="url(#chipGrad)" stroke="#EA580C" stroke-width="2" />
  <!-- Chip Pins -->
  <g fill="#94A3B8">
    <!-- Top Pins -->
    <rect x="260" y="132" width="6" height="8" />
    <rect x="275" y="132" width="6" height="8" />
    <rect x="290" y="132" width="6" height="8" />
    <rect x="305" y="132" width="6" height="8" />
    <rect x="320" y="132" width="6" height="8" />
    <rect x="335" y="132" width="6" height="8" />
    <!-- Bottom Pins -->
    <rect x="260" y="240" width="6" height="8" />
    <rect x="275" y="240" width="6" height="8" />
    <rect x="290" y="240" width="6" height="8" />
    <rect x="305" y="240" width="6" height="8" />
    <rect x="320" y="240" width="6" height="8" />
    <rect x="335" y="240" width="6" height="8" />
  </g>
  <!-- Chip Core Text -->
  <circle cx="300" cy="180" r="14" fill="#0F172A" stroke="#F97316" stroke-width="1.5" />
  <path d="M300 172 L306 182 L294 182 Z" fill="#F97316" />
  <text x="300" y="215" font-family="monospace" font-size="8" fill="#F8FAFC" font-weight="bold" text-anchor="middle">KASHBOT EMBEDDED</text>
  <text x="300" y="225" font-family="monospace" font-size="7" fill="#F97316" text-anchor="middle">ROS 2 / CAN-BUS</text>

  <!-- Peripheral Sensor Interface Modules -->
  <!-- Module 1: IMU & Spatial Sensor -->
  <rect x="130" y="170" width="65" height="50" rx="4" fill="#0F172A" stroke="#EA580C" stroke-width="1.5" />
  <text x="140" y="195" font-family="monospace" font-size="8" fill="#F8FAFC" font-weight="bold">IMU 6-DOF</text>
  <circle cx="180" cy="195" r="4" fill="#F97316" />

  <!-- Module 2: CAN-Bus Transceiver -->
  <rect x="400" y="90" width="70" height="40" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
  <text x="410" y="112" font-family="monospace" font-size="8" fill="#F8FAFC" font-weight="bold">CAN-BUS</text>
  <circle cx="455" cy="110" r="3" fill="#F97316" />

  <!-- Status LED Array -->
  <g>
    <circle cx="150" cy="310" r="5" fill="#F97316" />
    <circle cx="170" cy="310" r="5" fill="#F59E0B" />
    <circle cx="190" cy="310" r="5" fill="#0284C7" />
    <text x="210" y="314" font-family="monospace" font-size="9" fill="#94A3B8">STATUS: LIVE TELEMETRY</text>
  </g>

  <!-- Kashbot Board Header -->
  <text x="95" y="335" font-family="monospace" font-size="11" font-weight="bold" fill="#F97316">KASHBOT R&amp;D PROTOTYPE REV 2.4</text>
</svg>
