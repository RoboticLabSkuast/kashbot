<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="roverBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C3B2E"/>
      <stop offset="100%" stop-color="#165342"/>
    </linearGradient>
    <linearGradient id="roverAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Technical Grid Background -->
  <g opacity="0.15">
    <line x1="50" y1="50" x2="550" y2="50" stroke="#0C3B2E" stroke-dasharray="4 4" />
    <line x1="50" y1="150" x2="550" y2="150" stroke="#0C3B2E" stroke-dasharray="4 4" />
    <line x1="50" y1="250" x2="550" y2="250" stroke="#0C3B2E" stroke-dasharray="4 4" />
    <line x1="150" y1="50" x2="150" y2="350" stroke="#0C3B2E" stroke-dasharray="4 4" />
    <line x1="300" y1="50" x2="300" y2="350" stroke="#0C3B2E" stroke-dasharray="4 4" />
    <line x1="450" y1="50" x2="450" y2="350" stroke="#0C3B2E" stroke-dasharray="4 4" />
  </g>

  <!-- Ground Plane & Crop Row -->
  <line x1="40" y1="330" x2="560" y2="330" stroke="#CBD5E1" stroke-width="3" />
  <rect x="40" y="330" width="520" height="40" fill="url(#groundGrad)" />
  <!-- Crop stalks in field -->
  <g stroke="#10B981" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="60" y1="330" x2="65" y2="305" />
    <line x1="90" y1="330" x2="85" y2="300" />
    <line x1="120" y1="330" x2="125" y2="310" />
    <line x1="480" y1="330" x2="485" y2="305" />
    <line x1="510" y1="330" x2="505" y2="295" />
    <line x1="540" y1="330" x2="545" y2="310" />
  </g>

  <!-- Rover Chassis Main -->
  <rect x="180" y="190" width="240" height="90" rx="16" fill="url(#roverBody)" stroke="#07251D" stroke-width="2" />
  <rect x="195" y="205" width="210" height="15" rx="4" fill="url(#roverAccent)" opacity="0.9" />

  <!-- RTK Antenna Mast -->
  <line x1="220" y1="190" x2="220" y2="100" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <ellipse cx="220" cy="98" rx="14" ry="6" fill="#0C3B2E" />
  <ellipse cx="220" cy="95" rx="10" ry="4" fill="#10B981" />
  <!-- Signal Waves from RTK -->
  <path d="M205 85 C215 78 225 78 235 85" stroke="#10B981" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M198 75 C212 65 228 65 242 75" stroke="#10B981" stroke-width="2" fill="none" opacity="0.4" />

  <!-- LiDAR Sensor Turret -->
  <rect x="285" y="165" width="30" height="25" rx="4" fill="#334155" />
  <ellipse cx="300" cy="165" rx="15" ry="6" fill="#0284C7" />
  <line x1="300" y1="165" x2="440" y2="110" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
  <line x1="300" y1="165" x2="450" y2="140" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Dual High-Torque All-Terrain Wheels -->
  <!-- Left Wheel Group -->
  <g>
    <circle cx="215" cy="300" r="42" fill="#1E293B" stroke="#0F172A" stroke-width="4" />
    <circle cx="215" cy="300" r="26" fill="#334155" />
    <circle cx="215" cy="300" r="10" fill="#10B981" />
    <!-- Wheel Treads -->
    <line x1="215" y1="260" x2="215" y2="272" stroke="#64748B" stroke-width="3" />
    <line x1="215" y1="328" x2="215" y2="340" stroke="#64748B" stroke-width="3" />
    <line x1="175" y1="300" x2="187" y2="300" stroke="#64748B" stroke-width="3" />
    <line x1="243" y1="300" x2="255" y2="300" stroke="#64748B" stroke-width="3" />
  </g>

  <!-- Right Wheel Group -->
  <g>
    <circle cx="385" cy="300" r="42" fill="#1E293B" stroke="#0F172A" stroke-width="4" />
    <circle cx="385" cy="300" r="26" fill="#334155" />
    <circle cx="385" cy="300" r="10" fill="#10B981" />
    <!-- Wheel Treads -->
    <line x1="385" y1="260" x2="385" y2="272" stroke="#64748B" stroke-width="3" />
    <line x1="385" y1="328" x2="385" y2="340" stroke="#64748B" stroke-width="3" />
    <line x1="345" y1="300" x2="357" y2="300" stroke="#64748B" stroke-width="3" />
    <line x1="413" y1="300" x2="425" y2="300" stroke="#64748B" stroke-width="3" />
  </g>

  <!-- Suspension Linkage Bar -->
  <line x1="215" y1="260" x2="385" y2="260" stroke="#475569" stroke-width="6" stroke-linecap="round" />

  <!-- Front Vision Sensor & Status Indicator -->
  <rect x="405" y="225" width="25" height="30" rx="4" fill="#0F172A" />
  <circle cx="417" cy="240" r="6" fill="#0284C7" />
  <!-- Telemetry HUD Callouts -->
  <g font-family="monospace" font-size="11" fill="#0C3B2E">
    <rect x="360" y="60" width="165" height="36" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
    <text x="370" y="78" font-weight="bold" fill="#0C3B2E">KASHBOT AUTONOMOUS</text>
    <text x="370" y="90" fill="#059669">RTK-GNSS: ACCURATE 2cm</text>
    <line x1="360" y1="78" x2="235" y2="98" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2 2" />
  </g>
</svg>
